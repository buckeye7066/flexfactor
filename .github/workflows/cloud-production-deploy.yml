name: cloud-production-deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Stage for README acceptance, or promote an already accepted deployment
        required: true
        default: stage
        type: choice
        options:
          - stage
          - promote
      deployment_url:
        description: Exact immutable staged URL; required only for promote after README acceptance
        required: false
        type: string
      expected_sha:
        description: Exact current main commit authorized for staging or promotion
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flexfactor-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    steps:
      - name: Authorize the exact main revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_REF" = "refs/heads/main"
          live_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$EXPECTED_SHA" = "$live_main"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install the pinned Vercel CLI
        run: npm install --global vercel@48.11.0 --no-audit --no-fund

      - name: Require the existing production project
        working-directory: cloud
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          vercel project inspect flexfactor-cloud --scope buckeye7066-7954s-projects --token "$VERCEL_TOKEN" >/dev/null
          vercel link --yes --project flexfactor-cloud --scope buckeye7066-7954s-projects --token "$VERCEL_TOKEN"

      - name: Build an immutable staged production deployment
        if: inputs.action == 'stage'
        id: preview
        working-directory: cloud
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          cloud_sha=$(git log -1 --format=%H -- .)
          printf '%s' "$cloud_sha" | grep -Eq '^[0-9a-f]{40}$'
          deployment_url=$(vercel deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" \
            --env "FLEXFACTOR_CLOUD_SOURCE_SHA=$cloud_sha" | tail -n 1)
          printf '%s' "$deployment_url" \
            | grep -Eq '^https://[A-Za-z0-9.-]+\.vercel\.app$'
          printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Select and validate the immutable deployment URL
        id: selected
        working-directory: cloud
        env:
          DEPLOY_ACTION: ${{ inputs.action }}
          REQUESTED_URL: ${{ inputs.deployment_url }}
          STAGED_URL: ${{ steps.preview.outputs.deployment_url }}
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { appendFileSync } from "node:fs";
          const action = process.env.DEPLOY_ACTION;
          assert.ok(action === "stage" || action === "promote", "Unknown deployment action");
          if (action === "stage") assert.equal(process.env.REQUESTED_URL || "", "");
          const url = action === "stage" ? process.env.STAGED_URL : process.env.REQUESTED_URL;
          assert.equal(url, (url || "").trim());
          assert.match(url || "", /^https:\/\/flexfactor-cloud-[a-z0-9]+-buckeye7066-7954s-projects\.vercel\.app$/);
          appendFileSync(process.env.GITHUB_OUTPUT, `deployment_url=${url}\n`);
          JS

      - name: Verify Vercel deployment ownership and immutable identity
        working-directory: cloud
        env:
          DEPLOYMENT_URL: ${{ steps.selected.outputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          team_id=$(node -p 'JSON.parse(require("fs").readFileSync(".vercel/project.json", "utf8")).orgId')
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --data-urlencode "teamId=$team_id" \
            "https://api.vercel.com/v13/deployments/${DEPLOYMENT_URL#https://}" \
            > deployment-metadata.json
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const linked = JSON.parse(readFileSync(".vercel/project.json", "utf8"));
          const deployment = JSON.parse(readFileSync("deployment-metadata.json", "utf8"));
          assert.match(linked.projectId || "", /^prj_[A-Za-z0-9]+$/);
          assert.match(linked.orgId || "", /^team_[A-Za-z0-9]+$/);
          assert.equal(deployment.projectId, linked.projectId);
          assert.equal(deployment.name, "flexfactor-cloud");
          assert.equal(deployment.url, process.env.DEPLOYMENT_URL.slice("https://".length));
          assert.equal(deployment.readyState, "READY");
          assert.equal(deployment.target, "production");
          JS

      - name: Prove staged production health and engine identity
        working-directory: cloud
        env:
          DEPLOYMENT_URL: ${{ steps.selected.outputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if vercel curl /api/health --deployment "$DEPLOYMENT_URL" \
                --token "$VERCEL_TOKEN" > preview-health.json; then
              if CLOUD_SOURCE_SHA="$(git log -1 --format=%H -- .)" node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import { ENGINE_REF, SERVICE_NAME, SERVICE_VERSION } from "./lib/config.js";

          const health = JSON.parse(await readFile("preview-health.json", "utf8"));
          assert.equal(health.ok, true);
          assert.equal(health.oauth_device_configured, true);
          assert.equal(health.service, SERVICE_NAME);
          assert.equal(health.version, SERVICE_VERSION);
          assert.equal(health.engine_ref, ENGINE_REF);
          assert.equal(health.source_revision, process.env.CLOUD_SOURCE_SHA);
          assert.equal(health.deployment_url, process.env.DEPLOYMENT_URL);
          console.log(JSON.stringify(health));
          JS
              then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 30 ]; then sleep 5; fi
          done
          echo "Preview did not serve the expected healthy engine" >&2
          exit 1

      - name: Record the immutable staged deployment for acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-staged-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud/preview-health.json
          if-no-files-found: error
          retention-days: 30

      # Manual promotion is authorized only after cloud/README.md acceptance.
      # Health and ownership checks here do not replace OAuth, modes, or in-app acceptance.
      - name: Reauthorize and promote the tested deployment
        if: inputs.action == 'promote'
        working-directory: cloud
        env:
          DEPLOYMENT_URL: ${{ steps.selected.outputs.deployment_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          live_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$EXPECTED_SHA" = "$live_main"
          vercel promote "$DEPLOYMENT_URL" --yes \
            --scope buckeye7066-7954s-projects --token "$VERCEL_TOKEN"

      - name: Prove the production alias serves the tested engine
        if: inputs.action == 'promote'
        working-directory: cloud
        env:
          DEPLOYMENT_URL: ${{ steps.selected.outputs.deployment_url }}
        run: |
          set -euo pipefail
          export CLOUD_SOURCE_SHA="$(git log -1 --format=%H -- .)"
          for attempt in {1..30}; do
            if node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { ENGINE_REF, SERVICE_NAME, SERVICE_VERSION } from "./lib/config.js";

          const response = await fetch(
            "https://flexfactor-cloud.vercel.app/api/health",
            { signal: AbortSignal.timeout(15000) },
          );
          assert.equal(response.status, 200);
          const health = await response.json();
          assert.equal(health.ok, true);
          assert.equal(health.oauth_device_configured, true);
          assert.equal(health.service, SERVICE_NAME);
          assert.equal(health.version, SERVICE_VERSION);
          assert.equal(health.engine_ref, ENGINE_REF);
          assert.equal(health.source_revision, process.env.CLOUD_SOURCE_SHA);
          assert.equal(health.deployment_url, process.env.DEPLOYMENT_URL);
          console.log(JSON.stringify(health));
          JS
            then
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then sleep 2; fi
          done
          echo "Production alias did not converge to the verified deployment" >&2
          exit 1
