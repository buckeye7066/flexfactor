name: production-readiness

on:
  push:
    branches: [main, "cursor/production-ready/**", "production-ready/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-tests:
    name: windows-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned provider SDKs (PaidFallbackRescueTests import them)
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install .
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }
      - name: Launcher parse and installed-module smoke
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\flexfactor_launch.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Error }
          python -c "import flexfactor, flexfactor_runstate, flexfactor_evidence, flexfactor_web"
          if ($LASTEXITCODE -ne 0) { throw "installed module smoke failed" }
      - name: Run FlexFactor suite
        shell: pwsh
        run: |
          python flexfactor_tests.py
          if ($LASTEXITCODE -ne 0) { throw "flexfactor_tests failed" }

  linux-containment:
    name: linux-containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned provider SDKs (PaidFallbackRescueTests import them)
        run: |
          python -m pip install -r requirements.txt
          python -m pip install .
          python -m pip check
          python -m compileall -q .
      - name: Containment capability probe
        run: |
          python - <<'PY'
          import os, flexfactor as ff
          print("platform", os.name)
          print("O_NOFOLLOW", ff._HAS_O_NOFOLLOW)
          print("HAS_DIR_FD", ff._HAS_DIR_FD)
          print("HAS_REPLACE_DIR_FD", ff._HAS_REPLACE_DIR_FD)
          print("POSIX_NOFOLLOW", ff._POSIX_NOFOLLOW)
          print("FALLBACK_OK", ff._CONTAINMENT_FALLBACK_OK)
          s = getattr(os, "supports_dir_fd", set())
          for name in ("open", "unlink", "mkdir", "stat", "lstat", "replace", "rename"):
              fn = getattr(os, name, None)
              print(f"  {name} in supports_dir_fd:", fn in s if fn else None)
          PY
      - name: Run FlexFactor suite (Linux containment evidence)
        run: |
          python flexfactor_tests.py
      - name: Deterministic repository-intelligence smoke
        run: |
          python - <<'PY'
          import flexfactor_evidence as ev
          index = ev.build_repository_index('.', '${{ github.sha }}')
          print(index['totals'])
          assert index['totals']['tracked_or_relevant_source_files'] > 0
          assert index['totals']['analyzed_source_files'] > 0
          assert all(f.get('sha256') for f in index['files'] if f['category'] == 'source')
          PY
      - name: Forced verifier-outage regression
        run: |
          python -m unittest \
            flexfactor_tests.AdversarialFixLoopTests.test_c_transport_failure_rolls_back_fail_closed \
            flexfactor_tests.AuditDirtyAbortCommitGuardTests.test_verifier_outage_skips_success_commit \
            -v
