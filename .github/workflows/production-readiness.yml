name: production-readiness

# The binding gate for FlexFactor itself. Every production-relevant test module
# runs on BOTH platforms; the wheel is installed into a fresh environment and
# exercised from OUTSIDE the checkout; entry-point parity is proven by running
# the real processes. Zero tests collected is a failure. A missing required
# tool is a failure, never a pass.

on:
  push:
    branches: [main, "cursor/production-ready/**", "production-ready/**", "fix/provider-capacity-orchestration"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Managed cloud API contract
        shell: bash
        run: |
          npm ci --prefix cloud --no-audit --no-fund
          npm test --prefix cloud
      - name: Managed production cloud is ready on main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          health=$(curl --fail --silent --show-error --retry 3 \
            https://flexfactor-cloud.vercel.app/api/health)
          jq -e '.ok == true and .oauth_device_configured == true' <<<"$health"
      - name: Install pinned provider SDKs + the package
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -m pip install .
          python -m pip check
      - name: Static compile + import of every runtime module
        shell: bash
        run: |
          python -m compileall -q .
          python - <<'PY'
          import tomllib, importlib
          mods = tomllib.load(open("pyproject.toml", "rb"))["tool"]["setuptools"]["py-modules"]
          bad = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except Exception as ex:
                  bad.append((m, repr(ex)))
          assert not bad, bad
          print("imported", len(mods), "modules")
          PY
      - name: Windows PowerShell 5.1 parse gate for every tracked script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(git ls-files '*.ps1' '*.psm1' '*.psd1')
          if ($files.Count -eq 0) { throw 'No tracked PowerShell files found; parser gate is not exercising the launcher surface.' }
          $failures = @()
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $resolved = (Resolve-Path -LiteralPath $file).Path
            [System.Management.Automation.Language.Parser]::ParseFile($resolved, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($parseError in @($errors)) {
              $failures += "${file}:$($parseError.Extent.StartLineNumber):$($parseError.Extent.StartColumnNumber): $($parseError.Message)"
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "Parsed $($files.Count) tracked PowerShell files with Windows PowerShell $($PSVersionTable.PSVersion)."
      - name: Install Playwright package for the real browser journeys
        shell: bash
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.62.1
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npx playwright install --with-deps chromium
      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: npx playwright install chromium
      - name: Unit + integration suites (every test module; zero collected = failure)
        shell: bash
        run: |
          set -e
          python flexfactor_release_policy.py
          for t in flexfactor_tests.py \
                   flexfactor_execution_contract_tests.py \
                   test_flexfactor_release_policy.py \
                   flexfactor_product_invariants_tests.py \
                   flexfactor_steering_tests.py \
                   flexfactor_web_launcher_tests.py \
                   test_android_standalone.py \
                   test_target_publication.py \
                   flexfactor_invariant_sweep_tests.py \
                   flexfactor_prodevidence_tests.py \
                   flexfactor_entrypoint_tests.py \
                   flexfactor_node_lock_tests.py \
                   flexfactor_prodready_persistence_tests.py \
                   flexfactor_rotation_tests.py \
                   test_flexfactor_capacity.py \
                   flexfactor_locate_tests.py \
                   flexfactor_autoclean_tests.py \
                   flexfactor_autoclean_preverify_tests.py \
                   flexfactor_verified_sweep_tests.py \
                   flexfactor_cli_provider_tests.py \
                   flexfactor_errors_tests.py \
                   flexfactor_structural_tests.py \
                   flexfactor_openai_param_tests.py \
                   flexfactor_intent_tests.py \
                   flexfactor_paidfirst_tests.py \
                   flexfactor_quality_tests.py \
                   flexfactor_localbench_tests.py \
                   flexfactor_glimmer_tests.py \
                   flexfactor_config_surface_tests.py \
                   flexfactor_ledger_routing_tests.py \
                   flexfactor_dashboard_tests.py \
                   flexfactor_purpose_wiring_tests.py \
                   flexfactor_model_mode_tests.py \
                   flexfactor_route_fault_tests.py \
                   flexfactor_baseline_ledger_tests.py \
                   flexfactor_project_lookup_tests.py \
                   flexfactor_runtime_hardening_tests.py \
                   flexfactor_tenets_tests.py \
                   flexfactor_wip_removal_guard_tests.py \
                   test_flexfactor_trust.py \
                   test_flexfactor_partial.py \
                   test_flexfactor_wip.py \
                   test_flexfactor_sandbox.py \
                   test_flexfactor_ledger.py \
                   test_flexfactor_coverage.py \
                   test_flexfactor_purpose.py \
                   test_flexfactor_journeys.py \
                   test_ci_skip_policy.py \
                   test_live_cursor_aitime_proof.py \
                   test_stale_runtime_recurrence.py \
                   tests/test_cursor_provider.py; do
            if [ ! -f "$t" ]; then echo "MISSING required test module: $t"; exit 1; fi
            echo "=== $t"
            if [ "$t" = "flexfactor_dashboard_tests.py" ] && [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a python "$t" 2>&1 | tee "/tmp/$(basename "$t").log"
            else
              python "$t" 2>&1 | tee "/tmp/$(basename "$t").log"
            fi
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then echo "FAILED: $t (rc=$rc)"; exit "$rc"; fi
            if grep -q "^Ran 0 tests" "/tmp/$(basename "$t").log"; then echo "ZERO TESTS COLLECTED: $t"; exit 1; fi
          done
          python ci_skip_policy.py "$RUNNER_OS" /tmp/*.py.log
        env:
          FLEXFACTOR_ROTATION_EXTENSIONS: "1"
          FLEXFACTOR_E2E_ACTION_TIMEOUT_MS: "45000"
      - name: Rotation-extension tests
        shell: bash
        env:
          FLEXFACTOR_ROTATION_EXTENSIONS: "1"
        run: python tests/test_rotation_extensions.py
      - name: Forced verifier-outage regression (fail-closed proof)
        shell: bash
        run: |
          python -m unittest \
            flexfactor_tests.AdversarialFixLoopTests.test_c_transport_failure_rolls_back_fail_closed \
            flexfactor_tests.AuditDirtyAbortCommitGuardTests.test_verifier_outage_skips_success_commit \
            -v
      - name: Deterministic repository-intelligence smoke
        shell: bash
        run: |
          python - <<'PY'
          import flexfactor_evidence as ev
          index = ev.build_repository_index('.', '${{ github.sha }}')
          print(index['totals'])
          assert index['totals']['tracked_or_relevant_source_files'] > 0
          assert index['totals']['analyzed_source_files'] > 0
          assert all(f.get('sha256') for f in index['files'] if f['category'] == 'source')
          PY
      - name: Containment capability probe (recorded, never a pass by itself)
        shell: bash
        run: |
          python - <<'PY'
          import json, flexfactor_sandbox as sb
          print(json.dumps(sb.capability_report(), indent=2))
          PY

  package-artifact:
    name: package-artifact
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build exact-commit wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Installed-wheel smoke OUTSIDE the checkout (functional parity)
        run: |
          module_list="$(python - <<'PY'
          import json, tomllib
          mods = tomllib.load(open('pyproject.toml', 'rb'))['tool']['setuptools']['py-modules']
          print(json.dumps(mods, separators=(',', ':')))
          PY
          )"
          python -m venv /tmp/ffvenv
          /tmp/ffvenv/bin/python -m pip install -q dist/*.whl
          /tmp/ffvenv/bin/python -m pip check
          src_manifest="$(python flexfactor.py --runtime-manifest)"
          cd "$(mktemp -d)"
          inst_manifest="$(/tmp/ffvenv/bin/flexfactor --runtime-manifest)"
          python - "$src_manifest" "$inst_manifest" <<'PY'
          import json, sys
          src, inst = json.loads(sys.argv[1]), json.loads(sys.argv[2])
          assert inst["tool_version"] == "0.6.2" == src["tool_version"], (inst["tool_version"], src["tool_version"])
          for key in ("modes", "wired", "exit_codes"):
              assert inst[key] == src[key], (key, inst[key], src[key])
          missing = [k for k, v in inst["modules"].items() if not v["importable"]]
          assert not missing, missing
          assert "site-packages" in inst["module_file"], inst["module_file"]
          print("installed runtime == source runtime:", inst["module_file"])
          PY
          /tmp/ffvenv/bin/python - "$module_list" <<'PY'
          import importlib, json, sys
          modules = json.loads(sys.argv[1])
          failures = []
          for module in modules:
              try:
                  importlib.import_module(module)
              except Exception as exc:
                  failures.append((module, repr(exc)))
          assert not failures, failures
          print("installed wheel imported every declared runtime module:", len(modules))
          PY
          /tmp/ffvenv/bin/python - <<'PY'
          from importlib.resources import files
          profile = files("competitors").joinpath("default_profiles.json")
          assert profile.is_file(), profile
          print("installed wheel includes competitor profiles:", profile)
          PY
          for mode in refactor scout audit prodready policy; do
            /tmp/ffvenv/bin/flexfactor "$mode" --help > /dev/null
          done
          /tmp/ffvenv/bin/python - <<'PY'
          import flexfactor as ff
          import flexfactor_directed as directed
          directed.install(vars(ff))
          assert ff._CODE_EXTS == set(ff._TREE_SITTER_LANGUAGE_BY_EXT)
          assert directed._POWERSHELL_EXTS <= ff._CODE_EXTS
          failures = {}
          for extension in sorted(ff._CODE_EXTS):
              ok, note = ff._tree_sitter_source_syntax_ok(extension, b"")
              if ok is not True:
                  failures[extension] = note
          assert not failures, failures
          print("installed wheel parsed", len(ff._CODE_EXTS), "source extensions")
          PY
      - name: Record SHA-256 checksums
        run: |
          python - <<'PY'
          import glob, hashlib
          from pathlib import Path
          wheels = sorted(glob.glob("dist/*.whl"))
          if not wheels:
              raise SystemExit("wheel build produced no artifact")
          lines = [f"{hashlib.sha256(Path(w).read_bytes()).hexdigest()}  {Path(w).name}" for w in wheels]
          Path("dist/SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY
      - name: Upload exact-commit release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flexfactor-0.6.2-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
