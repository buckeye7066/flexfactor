name: Repair PR 136 authority validation

on:
  push:
    branches: [fix/purpose-v2-contract-loading]
    paths:
      - .github/workflows/repair-pr136.yml
      - scripts/repair_pr136.py
      - scripts/repair_pr136_tests.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/purpose-v2-contract-loading
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded authority repairs
        run: |
          python scripts/repair_pr136.py
          python scripts/repair_pr136_tests.py
      - name: Run focused authority regressions
        run: |
          python -m py_compile flexfactor_purpose.py test_flexfactor_purpose.py
          python -m unittest -v test_flexfactor_purpose.PurposeContractV2Tests
          git diff --check
      - name: Commit repaired source
        shell: bash
        run: |
          if git diff --quiet -- flexfactor_purpose.py test_flexfactor_purpose.py; then
            echo 'No source repair diff produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flexfactor_purpose.py test_flexfactor_purpose.py
          git commit -m 'fix: align purpose authority validation across platforms'
          git push origin HEAD:fix/purpose-v2-contract-loading
