name: apply-flexfactor-review-followup

on:
  push:
    branches:
      - codex-flexfactor-041

permissions:
  contents: write

concurrency:
  group: flexfactor-review-followup-staging
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify review follow-up
        run: |
          if git apply --check flexfactor-review-followup.patch; then
            git apply flexfactor-review-followup.patch
          elif git apply --reverse --check flexfactor-review-followup.patch; then
            echo "Patch is already applied."
          else
            echo "Patch is neither applicable nor already applied." >&2
            exit 1
          fi
          git diff --check
          python -m py_compile flexfactor.py flexfactor_tests.py
          python -m unittest flexfactor_tests.IncompleteReviewLedgerTests -v
      - name: Commit verified review follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flexfactor.py flexfactor_tests.py
          if git diff --cached --quiet; then
            echo "No code changes remain to commit."
            exit 0
          fi
          git commit -m "fix(audit): preserve complete per-file finding reports"
          git push origin "HEAD:${GITHUB_REF_NAME}"
