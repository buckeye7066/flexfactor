name: mobile-cloud-live-proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit authorized for the live proof
        required: true
        type: string
      mode:
        description: Mode to verify (remaining runs refactor, audit, then prodready)
        type: choice
        options: [scout, refactor, audit, prodready, remaining]
        default: scout
        required: true

permissions:
  contents: read

concurrency:
  group: flexfactor-cloud-production
  cancel-in-progress: false

jobs:
  live-proof:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 360
    env:
      FLEXFACTOR_LIVE_PROOF_TOKEN: ${{ secrets.FLEXFACTOR_LIVE_PROOF_GITHUB_TOKEN }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      TARGET_REPOSITORY: buckeye7066/flexfactor-demo-tinystats
      SELECTED_MODE: ${{ inputs.mode || 'scout' }}
    steps:
      - name: Authorize the exact main revision and triggering owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$GITHUB_REF" = "refs/heads/main"
          printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          live_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$EXPECTED_SHA" = "$live_main"
          test -n "$FLEXFACTOR_LIVE_PROOF_TOKEN"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Exercise the released mobile control-plane path live
        shell: bash
        run: |
          set -uo pipefail
          case "$SELECTED_MODE" in
            scout|refactor|audit|prodready|remaining) ;;
            *) echo "Unsupported acceptance mode" >&2; exit 2 ;;
          esac
          modes="$SELECTED_MODE"
          if [ "$modes" = remaining ]; then modes="refactor audit prodready"; fi
          status=0
          for mode in $modes; do
            rm -f mobile-cloud-live-proof.json
            MODE="$mode" python .github/scripts/mobile_cloud_live_proof.py || status=1
            if [ -f mobile-cloud-live-proof.json ]; then
              cp mobile-cloud-live-proof.json "mobile-cloud-live-proof-$mode.json"
            fi
          done
          exit "$status"

      - name: Upload redacted live proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-cloud-live-proof-${{ inputs.expected_sha }}
          path: mobile-cloud-live-proof*.json
          if-no-files-found: error
          retention-days: 30
