name: One-shot Tenets finalization

on:
  push:
    branches: [fix/tenets-context-integration]
    paths:
      - .github/workflows/one-shot-tenets-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/tenets-context-integration
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Patch remaining findings and add regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tenets = Path('flexfactor_tenets.py')
          src = tenets.read_text(encoding='utf-8')

          old = '''        temporary_output = tempfile.TemporaryDirectory(prefix="flexfactor-tenets-rank-")
          rank_output = Path(temporary_output.name) / "ranked-files.json"
          invocation_command = command + ("--output", str(rank_output))
          try:
              completed = _run_bounded_process(
          '''
          new = '''        temporary_output = None
          try:
              temporary_output = tempfile.TemporaryDirectory(prefix="flexfactor-tenets-rank-")
              rank_output = Path(temporary_output.name) / "ranked-files.json"
              invocation_command = command + ("--output", str(rank_output))
              completed = _run_bounded_process(
          '''
          if old not in src:
              raise SystemExit('temporary-output anchor missing')
          src = src.replace(old, new, 1)

          old = '''            else:
                  stdout = stdout_bytes.decode("utf-8", errors="strict")
                  stderr = stderr_bytes.decode("utf-8", errors="replace")
                  if completed.returncode != 0:
                      status = "degraded"
                      message = _bounded_text(
                          f"Tenets exited with status {completed.returncode}: {stderr or stdout}"
                      )
                  else:
                      payload_bytes = stdout_bytes
          '''
          new = '''            else:
                  stderr = stderr_bytes.decode("utf-8", errors="replace")
                  if completed.returncode != 0:
                      stdout_diagnostic = stdout_bytes.decode("utf-8", errors="replace")
                      status = "degraded"
                      message = _bounded_text(
                          f"Tenets exited with status {completed.returncode}: {stderr or stdout_diagnostic}"
                      )
                  else:
                      payload_bytes = stdout_bytes
          '''
          if old not in src:
              raise SystemExit('stdout-decode anchor missing')
          src = src.replace(old, new, 1)

          old = '''        finally:
              temporary_output.cleanup()
          '''
          new = '''        finally:
              if temporary_output is not None:
                  temporary_output.cleanup()
          '''
          if old not in src:
              raise SystemExit('temporary-cleanup anchor missing')
          src = src.replace(old, new, 1)

          start = src.index('def _argv_task(argv: Sequence[str] | None) -> str:\n')
          end = src.index('\n\ndef _infer_project_root', start)
          replacement = r'''def _argv_values(args: Sequence[str], flag: str) -> list[str]:
              """Return every non-empty value supplied for one CLI flag, in order."""
              values: list[str] = []
              prefix = flag + "="
              for index, item in enumerate(args):
                  if item == flag and index + 1 < len(args):
                      value = str(args[index + 1]).strip()
                      if value:
                          values.append(value)
                  elif isinstance(item, str) and item.startswith(prefix):
                      value = item.partition("=")[2].strip()
                      if value:
                          values.append(value)
              return values


          def _program_identity(value: str | os.PathLike[str]) -> str:
              """Portable identity used only to associate a prompt with its target root."""
              text = str(value or "").strip()
              if not text:
                  return ""
              name = Path(text).name or text
              return re.sub(r"[^a-z0-9]+", "", name.lower())


          def _argv_task(
              argv: Sequence[str] | None,
              *,
              project: str | os.PathLike[str] | None = None,
          ) -> str:
              override = os.environ.get("FLEXFACTOR_TENETS_TASK", "").strip()
              if override:
                  return override
              args = list(argv or ())
              mode = next(
                  (item for item in args if item in {"refactor", "scout", "audit", "prodready"}),
                  "audit",
              )

              # A session prompt intentionally spans every target.
              session_prompts = _argv_values(args, "--session-prompt")
              if session_prompts:
                  return session_prompts[0]

              # Guiding prompts are positional with --program. Route the prompt for
              # this actual project root instead of capturing the first target's task.
              guiding_prompts = _argv_values(args, "--guiding-prompt")
              programs = _argv_values(args, "--program")
              if guiding_prompts:
                  if project is not None and programs:
                      root = Path(project).expanduser().resolve(strict=False)
                      root_full = os.path.normcase(str(root))
                      root_identity = _program_identity(root.name)
                      for index, program in enumerate(programs):
                          if index >= len(guiding_prompts):
                              break
                          candidate = Path(program).expanduser()
                          try:
                              candidate_full = os.path.normcase(str(candidate.resolve(strict=False)))
                          except OSError:
                              candidate_full = os.path.normcase(str(candidate.absolute()))
                          if (
                              candidate_full == root_full
                              or _program_identity(program) == root_identity
                          ):
                              return guiding_prompts[index]
                  if len(guiding_prompts) == 1:
                      return guiding_prompts[0]

              goals = _argv_values(args, "--goal")
              if goals:
                  return goals[0]
              return (
                  f"{mode} this application for production readiness: prioritize broken user journeys, "
                  "security and privacy defects, release blockers, failure handling, and missing tests"
              )
          '''
          # Dedent the raw replacement exactly to column zero.
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          src = src[:start] + replacement + src[end:]

          old = '''        task = _argv_task(argv)
              canonicalize = module_globals.get("_canon_rel")

              def context_for(root: Path) -> TenetsContextResult | None:
                  if not enabled():
                      return None
                  try:
                      result = cached_tenets_context(root, task)
          '''
          new = '''        canonicalize = module_globals.get("_canon_rel")

              def context_for(root: Path) -> TenetsContextResult | None:
                  if not enabled():
                      return None
                  try:
                      task = _argv_task(argv, project=root)
                      result = cached_tenets_context(root, task)
          '''
          if old not in src:
              raise SystemExit('install task anchor missing')
          src = src.replace(old, new, 1)

          tenets.write_text(src, encoding='utf-8')

          tests = Path('flexfactor_tenets_tests.py')
          t = tests.read_text(encoding='utf-8')
          anchor = '''    def test_empty_valid_result_is_degraded_not_success(self) -> None:\n'''
          insert = r'''    def test_valid_output_file_ignores_non_utf8_console_status(self) -> None:
              payload = {"files": [{"path": "src/app.py", "score": 0.97}]}

              def runner(command, **_kwargs):
                  output_path = Path(command[command.index("--output") + 1])
                  output_path.write_text(json.dumps(payload), encoding="utf-8")
                  return self._process(stdout=b"status:\xff\xfe\n")

              with mock.patch.object(
                  ft, "_find_tenets_executable", return_value="/usr/bin/tenets"
              ), mock.patch.object(ft, "_run_bounded_process", side_effect=runner):
                  result = ft.generate_tenets_context(self.root, "audit")
              self.assertEqual(result.status, "ok")
              self.assertEqual([item.path for item in result.files], ["src/app.py"])

              '''
          insert = '\n'.join(line[10:] if line.startswith('          ') else line for line in insert.splitlines())
          if anchor not in t:
              raise SystemExit('output-file test anchor missing')
          t = t.replace(anchor, insert + anchor, 1)

          anchor = '''    def test_malformed_json_is_fail_open(self) -> None:\n'''
          insert = r'''    def test_temporary_output_allocation_failure_is_fail_open_for_cli(self) -> None:
              with mock.patch.object(
                  ft, "_find_tenets_executable", return_value="/trusted/tenets"
              ), mock.patch.object(
                  ft.tempfile, "TemporaryDirectory", side_effect=OSError("temporary storage unavailable")
              ):
                  result = ft.generate_tenets_context(self.root, "audit")
              self.assertEqual(result.status, "degraded")
              self.assertIn("temporary storage unavailable", result.message)

              with mock.patch.object(
                  ft, "_find_tenets_executable", return_value="/trusted/tenets"
              ), mock.patch.object(
                  ft.tempfile, "TemporaryDirectory", side_effect=OSError("temporary storage unavailable")
              ), mock.patch("builtins.print"):
                  code = ft.run_cli([str(self.root), "audit", "--strict"])
              self.assertEqual(code, 1)

              '''
          insert = '\n'.join(line[10:] if line.startswith('          ') else line for line in insert.splitlines())
          if anchor not in t:
              raise SystemExit('temp failure test anchor missing')
          t = t.replace(anchor, insert + anchor, 1)

          anchor = '''\n\nclass TenetsInstallTests(unittest.TestCase):\n'''
          insert = r'''
              def test_multi_program_guiding_prompts_route_to_matching_project(self) -> None:
                  first = self.root.parent / "GrantFlow"
                  second = self.root.parent / "family-stewardship"
                  first.mkdir(exist_ok=True)
                  second.mkdir(exist_ok=True)
                  argv = [
                      "audit",
                      "--program", str(first),
                      "--guiding-prompt", "repair grant matching",
                      "--program", "family stewardship",
                      "--guiding-prompt", "repair family workflow",
                  ]
                  with mock.patch.dict(os.environ, {"FLEXFACTOR_TENETS_TASK": ""}, clear=False):
                      self.assertEqual(
                          ft._argv_task(argv, project=first), "repair grant matching"
                      )
                      self.assertEqual(
                          ft._argv_task(argv, project=second), "repair family workflow"
                      )
          '''
          insert = '\n'.join(line[10:] if line.startswith('          ') else line for line in insert.splitlines())
          if anchor not in t:
              raise SystemExit('multi-program test anchor missing')
          t = t.replace(anchor, insert + anchor, 1)
          tests.write_text(t, encoding='utf-8')

          env = Path('.env.example')
          e = env.read_text(encoding='utf-8')
          anchor = '''FLEXFACTOR_FIX_FILE_MAX_SECONDS=900\nFLEXFACTOR_PURPOSE_SAMPLES=3\n'''
          replacement = '''FLEXFACTOR_FIX_FILE_MAX_SECONDS=900\nFLEXFACTOR_PURPOSE_SAMPLES=3\n# Optional local Tenets context ranking. Set FLEXFACTOR_TENETS=0 to disable.\n# FLEXFACTOR_TENETS_TASK, when non-empty, overrides the ranking task for every target.\nFLEXFACTOR_TENETS=1\nFLEXFACTOR_TENETS_TASK=\n'''
          if anchor not in e:
              raise SystemExit('.env anchor missing')
          env.write_text(e.replace(anchor, replacement, 1), encoding='utf-8')
          PY
      - name: Compile and run targeted gates
        shell: bash
        run: |
          python -m py_compile flexfactor_tenets.py flexfactor_tenets_tests.py
          python flexfactor_tenets_tests.py
          python flexfactor_config_surface_tests.py
          git diff --check
      - name: Commit repairs and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-tenets-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add flexfactor_tenets.py flexfactor_tenets_tests.py .env.example .github/workflows/one-shot-tenets-finalize.yml
          git commit -m "Close final Tenets review and config gaps"
          git push origin HEAD:fix/tenets-context-integration
