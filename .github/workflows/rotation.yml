name: rotation-extensions

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      probe_copilot:
        description: Run bounded live capability checks instead of the offline suite
        type: boolean
        default: false

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  unit-tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.probe_copilot
    name: unit-tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install .

      - name: Smoke-import new modules
        shell: bash
        run: |
          python -c "import flexfactor_capacity; import flexfactor_discovery; import flexfactor_rotation"
          python -c "from providers.cursor_provider import CursorProvider, make_cursor_provider, CursorUnavailable"

      - name: Run existing rotation tests (must stay green)
        shell: bash
        run: python flexfactor_rotation_tests.py

      - name: Run shared provider-capacity tests
        shell: bash
        run: python test_flexfactor_capacity.py

      - name: Run rotation-extension tests
        shell: bash
        env:
          FLEXFACTOR_ROTATION_EXTENSIONS: "1"
        run: python tests/test_rotation_extensions.py

      - name: Run cursor provider tests
        shell: bash
        run: |
          python tests/test_cursor_provider.py
          python test_live_cursor_aitime_proof.py

  integration-tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.probe_copilot
    name: offline-integration-tests
    runs-on: ubuntu-latest
    env:
      FLEXFACTOR_ROTATION_EXTENSIONS: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install .

      - name: Run AI-time discovery fixture end to end (no network, no secrets)
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile

          import flexfactor_discovery as discovery

          secret = "sk-fixture-must-not-leak-1234567890"
          with tempfile.TemporaryDirectory() as tmp:
              config = os.path.join(tmp, "config.json")
              output = os.path.join(tmp, "catalog.auto.json")
              with open(config, "w", encoding="utf-8") as handle:
                  json.dump({"providers": [{
                      "name": "cursor-ci",
                      "model": "cursor-small",
                      "api_type": "cursor",
                      "base_url": "http://127.0.0.1:9/v1",
                      "pool": "cursor:subscription",
                      "cost_class": "subscription",
                      "tier": "strong",
                      "api_key": secret,
                  }]}, handle)
              os.environ["FLEXFACTOR_AITIME_CONFIG"] = config
              routes = discovery.discover_from_aitime()
              assert len(routes) == 1, routes
              assert routes[0]["id"] == "cursor-ci/cursor-small", routes[0]
              assert routes[0]["api"] == "cursor", routes[0]
              assert routes[0]["pool"] == "cursor:subscription", routes[0]
              assert secret not in json.dumps(routes), routes
              written = discovery.write_auto_catalog(routes, output)
              assert written == output and os.path.isfile(output), written
              with open(output, encoding="utf-8") as handle:
                  catalog = json.load(handle)
              assert catalog["schema"] == 1, catalog
              assert [row["id"] for row in catalog["routes"]] == [
                  "cursor-ci/cursor-small"
              ], catalog
              assert secret not in json.dumps(catalog), catalog
              print("fixture route discovered, serialized, scoped, and secret-free")
          PY

  lint:
    if: github.event_name != 'workflow_dispatch' || !inputs.probe_copilot
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check syntax (py_compile)
        run: |
          python -m py_compile flexfactor_capacity.py
          python -m py_compile flexfactor_discovery.py
          python -m py_compile providers/__init__.py
          python -m py_compile providers/cursor_provider.py
          python -m py_compile tests/test_rotation_extensions.py
          python -m py_compile tests/test_cursor_provider.py
          python -m py_compile scripts/live_cursor_aitime_proof.py
          python -m py_compile test_flexfactor_capacity.py
          python -m py_compile test_live_cursor_aitime_proof.py

  copilot-access:
    if: github.event_name == 'workflow_dispatch' && inputs.probe_copilot && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install the production-pinned CLI
        run: npm install --global @github/copilot@1.0.86 --no-audit --no-fund
      - name: Prove concrete model access without files or tools
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import subprocess, json, os
          successes = []
          for model in ("claude-sonnet-4.6", "gpt-5.4", "claude-haiku-4.5", "auto"):
              try:
                  result = subprocess.run(["copilot", "-s", "--no-ask-user", "--no-auto-update",
                      "--no-color", "--no-custom-instructions", "--available-tools=", "--model", model],
                      input="Reply with exactly OK. Do not use tools.", text=True,
                      capture_output=True, timeout=45)
                  ok = result.returncode == 0 and result.stdout.strip() == "OK"
                  blob = (result.stdout + result.stderr).lower()
                  reason = "ok" if ok else "model unavailable" if "not available" in blob else "authentication or allowance" if any(x in blob for x in ("authentication", "unauthorized", "quota", "credit", "subscription")) else "CLI response did not pass"
              except subprocess.TimeoutExpired:
                  ok, reason = False, "bounded timeout"
              detail = ""
              if not ok and reason != "bounded timeout":
                  detail = result.stderr.strip().replace(os.environ["COPILOT_GITHUB_TOKEN"], "[redacted]")[:400]
              print(json.dumps({"model":model,"passed":ok,"reason":reason,"detail":detail}), flush=True)
              if ok: successes.append(model)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("Verified Copilot models: " + json.dumps(successes) + "\n")
          if not successes: raise SystemExit("No configured Copilot model completed the bounded probe")
          # Diagnostic only: do not treat an opaque auto model as an independent reviewer.
          metadata = subprocess.run(["copilot", "-s", "--no-ask-user", "--no-auto-update",
              "--no-color", "--no-custom-instructions", "--available-tools=", "--model", "auto",
              "--output-format", "json"], input="Reply with exactly OK. Do not use tools.",
              text=True, capture_output=True, timeout=45)
          models, types = [], []
          def inspect(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if "model" in key.lower() and isinstance(item, str) and len(item) < 100:
                          models.append({key:item})
                      elif key == "type" and isinstance(item, str): types.append(item)
                      if isinstance(item, (dict, list)): inspect(item)
              elif isinstance(value, list):
                  for item in value: inspect(item)
          for line in metadata.stdout.splitlines():
              try: inspect(json.loads(line))
              except ValueError: pass
          print(json.dumps({"model_metadata":models,"event_types":types,"exit":metadata.returncode}), flush=True)
