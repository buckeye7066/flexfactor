name: rotation-extensions

on:
  push:
    branches:
      - main
      - "feature/rotation-cursor-competitors"
      - "cursor/production-ready/**"
      - "copilot/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Set to 1 to run heavy integration tests (requires real Cursor / ai-time)"
        required: false
        default: "0"

jobs:
  unit-tests:
    name: unit-tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install .

      - name: Smoke-import new modules
        shell: bash
        run: |
          python -c "import flexfactor_discovery; import flexfactor_rotation"
          python -c "from providers.cursor_provider import CursorProvider, make_cursor_provider, CursorUnavailable"

      - name: Run existing rotation tests (must stay green)
        shell: bash
        run: python flexfactor_rotation_tests.py

      - name: Run rotation-extension tests
        shell: bash
        env:
          FLEXFACTOR_ROTATION_EXTENSIONS: "1"
        run: python tests/test_rotation_extensions.py

      - name: Run cursor provider tests
        shell: bash
        run: python tests/test_cursor_provider.py

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event.inputs.run_integration == '1' || env.CI_INTEGRATION == '1' }}
    env:
      CI_INTEGRATION: ${{ vars.CI_INTEGRATION || '0' }}
      FLEXFACTOR_ROTATION_EXTENSIONS: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install .

      - name: Run discovery (no network, no secrets)
        run: |
          python flexfactor_discovery.py || true

      - name: Validate auto catalog shape
        run: |
          python -c "
          import flexfactor_rotation as R, os
          cat_path = 'catalog.auto.json'
          if os.path.exists(cat_path):
              cat = R.load_catalog(cat_path)
              assert cat is not None, 'catalog.auto.json loaded as None'
              print(f'catalog.auto.json: {len(cat.routes)} routes')
          else:
              print('catalog.auto.json not produced (no sources available) — OK')
          "

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check syntax (py_compile)
        run: |
          python -m py_compile flexfactor_discovery.py
          python -m py_compile providers/__init__.py
          python -m py_compile providers/cursor_provider.py
          python -m py_compile tests/test_rotation_extensions.py
          python -m py_compile tests/test_cursor_provider.py
