name: agent-fix-pr113-final-review

on:
  push:
    branches: ["ai/futuretools-tenets-context"]
    paths:
      - .github/workflows/_agent-fix-pr113-final-review.yml

permissions:
  contents: write

concurrency:
  group: flexfactor-pr113-final-review
  cancel-in-progress: false

jobs:
  repair-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ai/futuretools-tenets-context
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply bounded-review correctness repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          source_path = Path("flexfactor_tenets.py")
          source = source_path.read_text(encoding="utf-8")
          source = replace_once(
              source,
              "MAX_ENUMERATION_FILES = 100_000\n",
              "# Python sequences cannot contain more than sys.maxsize elements. Using\n"
              "# that interpreter bound neutralizes the caller's review quota without\n"
              "# imposing a smaller, arbitrary repository cutoff before prioritization.\n"
              "_UNBOUNDED_ENUMERATION_LIMIT = sys.maxsize\n",
              "enumeration sentinel",
          )
          source = source.replace(
              "MAX_ENUMERATION_FILES",
              "_UNBOUNDED_ENUMERATION_LIMIT",
          )
          source = replace_once(
              source,
              """            source_files, cap = _call_with_lifted_cap(
                prior,
                module_globals,
                args,
                kwargs,
            )
            prioritized = _prioritize_paths(source_files, result.files, canonicalize)
            return _limit_paths(prioritized, cap)
""",
              """            try:
                source_files, cap = _call_with_lifted_cap(
                    prior,
                    module_globals,
                    args,
                    kwargs,
                )
            except Exception as exc:
                # Tenets is optional. If uncapped discovery cannot complete,
                # retry the canonical capped call and report degraded ranking.
                message = _bounded_text(
                    f"uncapped enumeration failed; original order preserved: {exc}"
                )
                degraded = result.to_dict()
                degraded["status"] = "degraded"
                degraded["message"] = message
                module_globals["_TENETS_CONTEXT_LAST"] = degraded
                module_globals["_TENETS_CONTEXT_LAST_ERROR"] = message
                return prior(*args, **kwargs)
            prioritized = _prioritize_paths(source_files, result.files, canonicalize)
            return _limit_paths(prioritized, cap)
""",
              "enumeration fallback",
          )
          if "MAX_ENUMERATION_FILES" in source:
              raise SystemExit("obsolete fixed enumeration ceiling remains")
          source_path.write_text(source, encoding="utf-8", newline="\n")

          tests_path = Path("flexfactor_tenets_tests.py")
          tests = tests_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              "        self.assertEqual(observed_caps, [ft.MAX_ENUMERATION_FILES])\n",
              "        self.assertEqual(observed_caps, [sys.maxsize])\n",
              "parameter-cap expectation",
          )
          tests = replace_once(
              tests,
              """        runtime: dict[str, object] = {"MAX_FILES_PER_RUN": 2}
        exec(
            "def _enumerate_source_files(project_dir):\\n"
            "    files = ['src/first.py', 'src/second.py', 'src/target.py']\\n"
            "    return files[:MAX_FILES_PER_RUN]\\n",
            runtime,
        )
""",
              """        runtime: dict[str, object] = {"MAX_FILES_PER_RUN": 2}

        def enumerate_source_files(project_dir: str):
            files = ["src/first.py", "src/second.py", "src/target.py"]
            limit = runtime["MAX_FILES_PER_RUN"]
            assert isinstance(limit, int)
            return files[:limit]

        runtime["_enumerate_source_files"] = enumerate_source_files
""",
              "exec fixture",
          )
          tests = replace_once(
              tests,
              """        self.assertEqual(result, ["src/target.py", "src/first.py"])
        self.assertEqual(len(result), 2)

    def test_ranked_file_beyond_positional_cap_enters_budget(self) -> None:
""",
              """        self.assertEqual(result, ["src/target.py", "src/first.py"])
        self.assertEqual(len(result), 2)

    def test_lifted_parameter_cap_has_no_fixed_repository_ceiling(self) -> None:
        observed_caps: list[int] = []

        def enumerate_source_files(project_dir: str, max_files: int = 2):
            observed_caps.append(max_files)
            files = ["src/first.py", "src/second.py"]
            if max_files > 100_000:
                files.append("src/target.py")
            return files[:max_files]

        runtime = {"_enumerate_source_files": enumerate_source_files}
        with mock.patch.object(
            ft,
            "cached_tenets_context",
            return_value=self._result("src/target.py"),
        ):
            ft.install(runtime)
            result = runtime["_enumerate_source_files"](str(self.root), max_files=2)
        self.assertEqual(observed_caps, [sys.maxsize])
        self.assertEqual(result, ["src/target.py", "src/first.py"])

    def test_uncapped_enumeration_failure_preserves_original_and_reports_degraded(self) -> None:
        original = ["src/first.py", "src/second.py", "src/target.py"]

        def enumerate_source_files(project_dir: str, max_files: int = 2):
            if max_files == sys.maxsize:
                raise MemoryError("candidate set exceeds available memory")
            return list(original[:max_files])

        runtime = {"_enumerate_source_files": enumerate_source_files}
        with mock.patch.object(
            ft,
            "cached_tenets_context",
            return_value=self._result("src/target.py"),
        ):
            ft.install(runtime)
            result = runtime["_enumerate_source_files"](str(self.root), max_files=2)
        self.assertEqual(result, ["src/first.py", "src/second.py"])
        evidence = runtime["_TENETS_CONTEXT_LAST"]
        self.assertIsInstance(evidence, dict)
        assert isinstance(evidence, dict)
        self.assertEqual(evidence["status"], "degraded")
        self.assertIn("original order preserved", evidence["message"])

    def test_ranked_file_beyond_positional_cap_enters_budget(self) -> None:
""",
              "new cap regressions",
          )
          if "        exec(\n" in tests:
              raise SystemExit("exec fixture remains")
          tests_path.write_text(tests, encoding="utf-8", newline="\n")

          docs_path = Path("docs/FUTURETOOLS_TENETS.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = replace_once(
              docs,
              """evidence and preserves FlexFactor's original file order and cap.
`flexfactor-context --strict` returns non-zero in those cases for CI or operator
verification.
""",
              """evidence and preserves FlexFactor's original file order and cap. If
uncapped candidate discovery cannot complete, the adapter records degraded
evidence and reruns the original capped enumerator unchanged.
`flexfactor-context --strict` returns non-zero in those cases for CI or operator
verification.
""",
              "failure documentation",
          )
          docs_path.write_text(docs, encoding="utf-8", newline="\n")

          Path(".github/workflows/_agent-fix-pr113-final-review.yml").unlink()
          PY

          git diff --check
          python -m py_compile flexfactor_tenets.py flexfactor_tenets_tests.py
          python flexfactor_tenets_tests.py
          python -m pip install "ruff==0.16.3"
          python -m ruff check flexfactor_tenets.py flexfactor_tenets_tests.py

      - name: Commit and push verified repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: remove Tenets enumeration ceiling and exec fixture"
          git push origin HEAD:ai/futuretools-tenets-context
