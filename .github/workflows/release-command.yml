name: owner-release-command

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-android:
    name: dispatch-exact-main-android-release
    if: >-
      github.actor == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/release-android ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the exact authorized main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          requested_sha=$(printf '%s\n' "$COMMAND_BODY" \
            | sed -n 's/^\/release-android \([0-9a-f]\{40\}\)$/\1/p')
          printf '%s' "$requested_sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "Use /release-android followed by one exact commit SHA" >&2; exit 1; }
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')
          test "$requested_sha" = "$main_sha" \
            || { echo "Requested release SHA is not the current main commit" >&2; exit 1; }
          gh workflow run android-client.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f expected_sha="$requested_sha"
