name: One-shot Tenets hardening

on:
  push:
    branches:
      - fix/tenets-context-integration
    paths:
      - .github/workflows/one-shot-tenets-hardening.yml
      - .github/scripts/one_shot_tenets_hardening.py
      - .github/scripts/run_one_shot_tenets_hardening.py

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/tenets-context-integration
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply hardening patch
        run: python .github/scripts/run_one_shot_tenets_hardening.py
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify hardening
        shell: bash
        run: |
          set -e
          python -m py_compile flexfactor.py flexfactor_tenets.py flexfactor_tenets_tests.py flexfactor_invariant_sweep_tests.py
          python flexfactor_tenets_tests.py
          python flexfactor_invariant_sweep_tests.py
          git diff --check
      - name: Commit permanent core fixes
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flexfactor.py flexfactor_tenets.py flexfactor_tenets_tests.py flexfactor_invariant_sweep_tests.py
          git diff --cached --quiet && { echo 'No core hardening diff'; exit 1; }
          git commit -m 'Close Tenets integration review gaps'
          git push origin HEAD:fix/tenets-context-integration
