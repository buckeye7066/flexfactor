name: Package exact FlexFactor runtime

on:
  push:
    branches:
      - runtime/af48d363
    paths:
      - .github/workflows/package-runtime-af48d363.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: af48d363a76beed18468bcf3a546a1173c0a1eea
          persist-credentials: false
      - name: Build exact runtime archive
        run: |
          zip -X -q flexfactor-runtime-af48d363.zip \
            requirements.txt \
            flexfactor_self_audit_report.py \
            flexfactor_egress.py \
            docs/purpose-contract.schema.json \
            docs/purpose-contract.md \
            flexfactor_scout_contract.py \
            flexfactor_competitors.py \
            flexfactor_dashboard.py \
            flexfactor_purpose.py \
            flexfactor_prodready.py \
            flexfactor_cmdpolicy.py \
            flexfactor_web.py \
            .flexfactor-secret-baseline.json \
            memory/purpose_contracts.json \
            flexfactor.py \
            flexfactor_evidence.py \
            flexfactor_runstate.py \
            flexfactor_dashboard_v2.py \
            probe_tiers.py
          unzip -t flexfactor-runtime-af48d363.zip
          sha256sum flexfactor-runtime-af48d363.zip > flexfactor-runtime-af48d363.sha256
          unzip -p flexfactor-runtime-af48d363.zip flexfactor.py | grep -F 'single-provider-review-workers'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flexfactor-runtime-af48d363
          path: |
            flexfactor-runtime-af48d363.zip
            flexfactor-runtime-af48d363.sha256
          if-no-files-found: error
          retention-days: 14
