name: Materialize tested purpose-evidence repair

on:
  push:
    branches: [fix/purpose-evidence-routing-20260918]
    paths: [.github/workflows/materialize-purpose-evidence-fix.yml]

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'buckeye7066/flexfactor' && github.ref == 'refs/heads/fix/purpose-evidence-routing-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply exact-baseline tested patch and verify output identity
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply-purpose-evidence-fix.py
          test "$(git hash-object flexfactor.py)" = ae08575e27a9a62c3f7387144182bc22b04ce9a8
          python -m unittest test_purpose_evidence_routing -v
          python -m py_compile flexfactor.py test_purpose_evidence_routing.py
          git diff --check
      - name: Store verified source object without updating any branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/purpose-evidence-routing-20260918
          python - <<'PY' > "$RUNNER_TEMP/purpose-source.json"
          import base64, json, pathlib
          content = base64.b64encode(pathlib.Path('flexfactor.py').read_bytes()).decode('ascii')
          print(json.dumps({'encoding': 'base64', 'content': content}))
          PY
          sha=$(gh api --method POST repos/buckeye7066/flexfactor/git/blobs --input "$RUNNER_TEMP/purpose-source.json" --jq .sha)
          test "$sha" = ae08575e27a9a62c3f7387144182bc22b04ce9a8
          printf 'Verified source blob: %s\nNo branch updated by Actions.\n' "$sha"
