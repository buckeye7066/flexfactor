name: Verify exact purpose prompt compatibility repair

on:
  push:
    branches: [fix/purpose-evidence-routing-20260918]
    paths: [.github/workflows/materialize-purpose-evidence-fix.yml]

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'buckeye7066/flexfactor' && github.ref == 'refs/heads/fix/purpose-evidence-routing-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply exact one-line compatibility fix and run real routing regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object flexfactor.py)" = ae08575e27a9a62c3f7387144182bc22b04ce9a8
          python - <<'PY'
          from pathlib import Path
          path = Path('flexfactor.py')
          content = path.read_bytes()
          old = b'"path_or_ref below, without kind/confidence labels or excerpt text. "'
          new = b'"path_or_ref below. Do not include kind/confidence labels or excerpt text. "'
          assert content.count(old) == 1, 'Source anchor changed'
          path.write_bytes(content.replace(old, new, 1))
          PY
          test "$(git hash-object flexfactor.py)" = ba981b1b3b354a94acd2656d8d436905144c61fd
          python -m unittest -v test_purpose_evidence_routing test_stale_runtime_recurrence
          python -m py_compile flexfactor.py test_purpose_evidence_routing.py test_stale_runtime_recurrence.py
          git diff --check
      - name: Store verified source object without changing any branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/purpose-source.json"
          import base64, json, pathlib
          content = base64.b64encode(pathlib.Path('flexfactor.py').read_bytes()).decode('ascii')
          print(json.dumps({'encoding': 'base64', 'content': content}))
          PY
          sha=$(gh api --method POST repos/buckeye7066/flexfactor/git/blobs --input "$RUNNER_TEMP/purpose-source.json" --jq .sha)
          test "$sha" = ba981b1b3b354a94acd2656d8d436905144c61fd
          printf 'Verified source blob: %s\nNo branch updated by Actions.\n' "$sha"
