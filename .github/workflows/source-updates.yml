name: Source update safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-update-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exercise real Git update and file preservation with local fixtures
        run: python -m unittest test_source_app_update -v
