name: tenets-context

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  adapter-tests:
    name: adapter-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      FLEXFACTOR_TENETS_CGROUP_ROOT: /sys/fs/cgroup/flexfactor-tenets-adapter-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Delegate aggregate Linux ranker limits
        if: runner.os == 'Linux'
        shell: bash
        run: |
          parent=$(dirname "$FLEXFACTOR_TENETS_CGROUP_ROOT")
          for controller in memory pids; do
            grep -qw "$controller" "$parent/cgroup.controllers"
            if ! grep -qw "$controller" "$parent/cgroup.subtree_control"; then
              printf '+%s\n' "$controller" | sudo tee "$parent/cgroup.subtree_control" >/dev/null
            fi
          done
          sudo mkdir "$FLEXFACTOR_TENETS_CGROUP_ROOT"
          sudo chown "$(id -u):$(id -g)" \
            "$FLEXFACTOR_TENETS_CGROUP_ROOT" \
            "$FLEXFACTOR_TENETS_CGROUP_ROOT/cgroup.procs" \
            "$FLEXFACTOR_TENETS_CGROUP_ROOT/cgroup.subtree_control"
          printf '+memory\n+pids\n' \
            > "$FLEXFACTOR_TENETS_CGROUP_ROOT/cgroup.subtree_control"
      - name: Compile and run hermetic adapter tests
        shell: bash
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          python -m py_compile flexfactor_tenets.py flexfactor_tenets_tests.py
          python flexfactor_tenets_tests.py
      - name: Verify the packaged command without optional dependencies
        shell: bash
        run: |
          python -m pip install .
          python -m pip check
          flexfactor-context --help > /dev/null

  live-tenets:
    name: live-tenets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      FLEXFACTOR_TENETS_CGROUP_ROOT: /sys/fs/cgroup/flexfactor-tenets-live-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Delegate aggregate Linux ranker limits
        if: runner.os == 'Linux'
        shell: bash
        run: |
          parent=$(dirname "$FLEXFACTOR_TENETS_CGROUP_ROOT")
          for controller in memory pids; do
            grep -qw "$controller" "$parent/cgroup.controllers"
            if ! grep -qw "$controller" "$parent/cgroup.subtree_control"; then
              printf '+%s\n' "$controller" | sudo tee "$parent/cgroup.subtree_control" >/dev/null
            fi
          done
          sudo mkdir "$FLEXFACTOR_TENETS_CGROUP_ROOT"
          sudo chown "$(id -u):$(id -g)" \
            "$FLEXFACTOR_TENETS_CGROUP_ROOT" \
            "$FLEXFACTOR_TENETS_CGROUP_ROOT/cgroup.procs" \
            "$FLEXFACTOR_TENETS_CGROUP_ROOT/cgroup.subtree_control"
          printf '+memory\n+pids\n' \
            > "$FLEXFACTOR_TENETS_CGROUP_ROOT/cgroup.subtree_control"
      - name: Install FlexFactor with the pinned Tenets integration
        shell: bash
        run: |
          python -m pip install ".[context]"
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          assert version("tenets") == "0.13.3", version("tenets")
          PY
      - name: Prove trusted executable resolution and real ranking
        shell: bash
        env:
          CONTEXT_OUTPUT: ${{ runner.temp }}/tenets-context.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          import flexfactor_tenets as ft

          root = Path(".").resolve()
          trap_root = Path(os.environ["CONTEXT_OUTPUT"]).resolve().parent / "tenets-traps"
          trap_root.mkdir(parents=True, exist_ok=True)
          python_marker = trap_root / "python-shadow-ran"
          git_marker = trap_root / "git-helper-ran"
          fsmonitor_marker = trap_root / "git-fsmonitor-ran"

          # A target-controlled import path must not shadow the pinned Tenets
          # package in the child interpreter.
          shadow_package = root / "tenets"
          shadow_package.mkdir()
          (shadow_package / "__init__.py").write_text(
              "from pathlib import Path\nPath(" + repr(str(python_marker)) + ").touch()\n",
              encoding="utf-8",
          )
          os.environ["PYTHONPATH"] = str(root)

          # A repository-named helper path (including a symlink/junction case)
          # must not survive in the child. The adapter invokes the console
          # script absolutely, so it can safely give Tenets an empty PATH.
          helper_target = trap_root / "helper-target"
          helper_target.mkdir()
          helper_link = root / ".tenets-helper-path"
          try:
              helper_link.symlink_to(helper_target, target_is_directory=True)
          except OSError:
              helper_link = helper_target
          if os.name == "nt":
              (helper_target / "git.cmd").write_text(
                  "@type nul > " + str(git_marker) + "\r\n", encoding="utf-8"
              )
          else:
              fake_git = helper_target / "git"
              fake_git.write_text(
                  "#!/bin/sh\n: > " + repr(str(git_marker)) + "\n", encoding="utf-8"
              )
              fake_git.chmod(0o755)

              # Prove repository-local executable Git configuration is inert.
              fsmonitor = trap_root / "fsmonitor.sh"
              fsmonitor.write_text(
                  "#!/bin/sh\n: > " + repr(str(fsmonitor_marker)) + "\n", encoding="utf-8"
              )
              fsmonitor.chmod(0o755)
              trusted_git = shutil.which("git")
              assert trusted_git
              subprocess.run(
                  [trusted_git, "config", "--local", "core.fsmonitor", str(fsmonitor)],
                  check=True,
              )

          interpreter_dir = Path(sys.executable).resolve().parent
          filtered = []
          for entry in os.environ.get("PATH", "").split(os.pathsep):
              if not entry:
                  continue
              try:
                  if Path(entry).resolve() == interpreter_dir:
                      continue
              except OSError:
                  pass
              filtered.append(entry)
          os.environ["PATH"] = os.pathsep.join(filtered)
          os.environ["PATH"] = str(helper_link) + os.pathsep + os.environ["PATH"]

          executable = ft._find_tenets_executable()
          assert executable, "Tenets was not resolved from the active Python installation"
          trusted_dirs = {
              interpreter_dir,
              Path(sys.prefix).resolve() / ("Scripts" if os.name == "nt" else "bin"),
          }
          assert Path(executable).resolve().parent in trusted_dirs, (
              executable,
              sorted(str(path) for path in trusted_dirs),
          )

          result = ft.generate_tenets_context(
              root,
              "identify production-readiness defects, broken user journeys, "
              "security risks, release blockers, and missing tests",
              top=20,
              timeout_seconds=180,
              output=os.environ["CONTEXT_OUTPUT"],
          )
          assert result.status == "ok", result.to_dict()
          assert not python_marker.exists(), "audited repo shadowed the Tenets package"
          assert not git_marker.exists(), "audited repo supplied an executable helper"
          assert not fsmonitor_marker.exists(), "repository-local core.fsmonitor executed"

          payload = json.loads(
              Path(os.environ["CONTEXT_OUTPUT"]).read_text(encoding="utf-8")
          )
          assert payload["status"] == "ok", payload
          assert payload["expected_version"] == "0.13.3", payload
          assert payload["adapter_version"] == 2, payload
          assert payload["files"], payload
          assert len(payload["files"]) <= 20, payload
          for item in payload["files"]:
              resolved = (root / item["path"]).resolve(strict=False)
              resolved.relative_to(root)
          print(
              "validated",
              len(payload["files"]),
              "contained ranked files using",
              executable,
          )
          PY
