name: apply-flexfactor-production-patch

on:
  push:
    branches:
      - codex-flexfactor-041

permissions:
  contents: write

concurrency:
  group: flexfactor-production-ready-staging
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact-base patch
        run: |
          if git apply --check flexfactor-production-ready.patch; then
            git apply flexfactor-production-ready.patch
          elif git apply --reverse --check flexfactor-production-ready.patch; then
            echo "Patch is already applied."
          else
            echo "Patch is neither applicable nor already applied." >&2
            exit 1
          fi
          git diff --check
          python -m py_compile flexfactor.py flexfactor_tests.py
      - name: Commit verified staging result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flexfactor.py flexfactor_tests.py
          if git diff --cached --quiet; then
            echo "No code changes remain to commit."
            exit 0
          fi
          git commit -m "fix(audit): preserve unresolved findings and bound baseline repair"
          git push origin "HEAD:${GITHUB_REF_NAME}"
