name: apply-flexfactor-production-patch

on:
  push:
    branches:
      - codex-flexfactor-041

permissions:
  contents: write

concurrency:
  group: flexfactor-production-ready-staging
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact-base patch
        run: |
          git apply --check flexfactor-production-ready.patch
          git apply flexfactor-production-ready.patch
          rm flexfactor-production-ready.patch
          rm .github/workflows/flexfactor-self-apply.yml
          git diff --check
          python -m py_compile flexfactor.py flexfactor_tests.py
      - name: Commit verified staging result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(audit): preserve unresolved findings and bound baseline repair"
          git push origin "HEAD:${GITHUB_REF_NAME}"
