name: agent-apply-pr110-bootstrap-fix

on:
  push:
    branches: [fix/autoclean-verifies-what-it-commits]
    paths:
      - .github/workflows/_agent-apply-pr110-bootstrap-fix.yml

permissions:
  contents: write

concurrency:
  group: flexfactor-pr110-agent-fix
  cancel-in-progress: false

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/autoclean-verifies-what-it-commits
          fetch-depth: 0

      - name: Apply deferred pre-bootstrap verification repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index --3way .github/agent/pr110-bootstrap-fix.patch
          git rm .github/agent/pr110-bootstrap-fix.patch
          git rm .github/workflows/_agent-apply-pr110-bootstrap-fix.yml
          git diff --cached --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run affected verification suites
        run: |
          python -m py_compile flexfactor.py flexfactor_verified_sweep_tests.py
          python flexfactor_verified_sweep_tests.py
          python flexfactor_autoclean_tests.py
          python flexfactor_invariant_sweep_tests.py

      - name: Commit and push verified repair
        shell: bash
        run: |
          git commit -m "fix(autoclean): defer dependency-dependent gate until bootstrap"
          git push origin HEAD:fix/autoclean-verifies-what-it-commits
