name: Repair PR149 contract surfaces

on:
  push:
    branches:
      - fix/scout-full-reproduction

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[pr149-contract-repair]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply contract, config, and invariant repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import datetime
          import hashlib
          import json

          root = Path('.')

          # 1) Document every new runtime variable introduced by PR149.
          env = root / '.env.example'
          text = env.read_text(encoding='utf-8')
          anchor = '''# Research and competitor evidence.\nFLEXFACTOR_REPO_REWARDS_URL=http://localhost:3000\n'''
          replacement = '''# Research and competitor evidence.\n# Number of corroborated competitors requested per research gate. Default: 25.\nFLEXFACTOR_COMPETITOR_TARGET=25\n# Maximum accepted competitor capabilities entering the fix stream. Default: 25; 0 explicitly disables fixes for that run.\nFLEXFACTOR_COMPETITOR_FIXES=25\n# Maximum Scout opportunities consumed by competitor research. Default: 25.\nFLEXFACTOR_SCOUT_OPPORTUNITIES=25\n# Orchestrator-wide competitor target/default used when a run does not override it. Default: 25.\nFLEXFACTOR_TOP_COMPETITORS=25\nFLEXFACTOR_REPO_REWARDS_URL=http://localhost:3000\n'''
          if anchor not in text:
              raise SystemExit('.env.example research anchor not found')
          env.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          # 2) Keep the human-readable owner contract synchronized with the new product default.
          md = root / 'docs/purpose-contract.md'
          m = md.read_text(encoding='utf-8')
          m = m.replace('**Version:** 0.3', '**Version:** 0.4', 1)
          if '## Competitive research contract' not in m:
              insert = '''\n## Competitive research contract\n\nAudit, Production Ready, and Scout research use a configurable competitor\ntarget with a default of 25. Explicit per-run limits are honored rather than\nsilently overwritten. Scout may carry every accepted, verified capability up to\nthe configured fix-stream limit so it can fully reproduce a capability instead\nof stopping at a three-item sample. Evidence, purpose fit, licensing, build,\ntest, and publication gates remain mandatory.\n'''
              marker = '\n## Resolved authority conflict\n'
              if marker not in m:
                  raise SystemExit('purpose-contract insertion anchor not found')
              m = m.replace(marker, insert + marker, 1)
          md.write_text(m, encoding='utf-8')

          # 3) Update the one structural invariant that still requires the retired
          # hard-coded target while preserving the requirement that the gate is wired.
          inv = root / 'flexfactor_product_invariants_tests.py'
          t = inv.read_text(encoding='utf-8')
          old = '        self.assertIn("target=_ff_execution.TOP_COMPETITORS", source)\n'
          new = '''        self.assertIn('getattr(args, "competitor_count", _ff_execution.TOP_COMPETITORS)', source)\n        self.assertIn('getattr(args, "competitor_fixes", _ff_execution.TOP_COMPETITORS)', source)\n'''
          if old not in t:
              raise SystemExit('product invariant target assertion anchor not found')
          inv.write_text(t.replace(old, new, 1), encoding='utf-8')

          # 4) Refresh the authoritative v2 contract content and evidence hashes.
          contract_path = root / '.flexfactor-purpose.json'
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          for claim in contract.get('current_behavior', []):
              if claim.get('id') == 'cb-2':
                  claim['text'] = ('Audit and Production Ready use at most six passes: the whole repository, '
                                   'a configurable competitor gate defaulting to 25, then verified edit deltas.')
          criteria = contract.get('acceptance_criteria', [])
          for i, value in enumerate(criteria):
              if value == 'C. Evaluate three corroborated competitors between passes 1 and 2.':
                  criteria[i] = ('C. Evaluate the configured corroborated-competitor target between passes 1 and 2; '
                                 'the default is 25 and explicit run limits are honored.')
          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          for record in contract.get('evidence', []):
              locator = record.get('locator')
              if not locator:
                  continue
              path = root / locator
              if path.is_file():
                  record['content_hash'] = hashlib.sha256(path.read_bytes()).hexdigest()
                  record['observed_at'] = now
          contract_path.write_text(json.dumps(contract, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Install exact Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install .
          python -m pip check
      - name: Verify the four previously failing modules
        env:
          FLEXFACTOR_ROTATION_EXTENSIONS: '1'
          FLEXFACTOR_E2E_ACTION_TIMEOUT_MS: '45000'
        run: |
          python flexfactor_tests.py
          python flexfactor_product_invariants_tests.py
          python flexfactor_config_surface_tests.py
          python test_flexfactor_purpose.py
      - name: Release policy
        run: python flexfactor_release_policy.py
      - name: Commit verified repair and remove helper
        run: |
          rm .github/workflows/repair-pr149-contract-surfaces.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .env.example docs/purpose-contract.md .flexfactor-purpose.json flexfactor_product_invariants_tests.py .github/workflows/repair-pr149-contract-surfaces.yml
          git commit -m 'fix: synchronize Scout contract and runtime configuration [pr149-contract-repair]'
          git push origin HEAD:fix/scout-full-reproduction
