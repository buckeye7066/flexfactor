name: one-shot-pr133-review2

on:
  push:
    branches:
      - fix/predictable-runtime-failures

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/predictable-runtime-failures
          fetch-depth: 0

      - name: Apply and verify review fixes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finish_pr133_review2.py
          python -m compileall -q flexfactor.py flexfactor_directed.py flexfactor_runtime_hardening_tests.py
          python flexfactor_runtime_hardening_tests.py
          git diff --check

      - name: Commit verified fixes and remove temporary executor
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-pr133-review2.yml scripts/finish_pr133_review2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flexfactor.py flexfactor_directed.py flexfactor_runtime_hardening_tests.py
          git diff --cached --check
          git commit -m 'Close remaining exact-head review findings'
          git push origin HEAD:fix/predictable-runtime-failures
