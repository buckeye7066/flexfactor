name: android-client

on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths:
      - "android/**"
      - "scripts/phone/**"
      - "flexfactor_web.py"
      - ".github/workflows/android-client.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/phone/**"
      - "flexfactor_web.py"
      - ".github/workflows/android-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: android-client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK 36
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0"
      - name: Unit tests, lint, and debug APK
        shell: bash
        run: gradle --no-daemon -p android testDebugUnitTest lintDebug assembleDebug
      - name: Record exact APK checksum
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          (cd android/app/build/outputs/apk/debug && sha256sum app-debug.apk > SHA256SUMS)
          printf '%s\n' "$SOURCE_SHA" > android/app/build/outputs/apk/debug/SOURCE_COMMIT
      - name: Upload exact-commit Android test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flexfactor-android-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS
            android/app/build/outputs/apk/debug/SOURCE_COMMIT
          if-no-files-found: error
          retention-days: 30

  release-plan:
    name: android-release-plan
    if: >-
      startsWith(github.ref, 'refs/tags/android-v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.plan.outputs.release_tag }}
      should_publish: ${{ steps.plan.outputs.should_publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require an Android version change on main
        id: plan
        shell: bash
        run: |
          read_version() {
            sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p'
          }
          version_name=$(read_version < android/app/build.gradle.kts)
          test -n "$version_name"
          release_tag="android-v${version_name}"
          should_publish=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "$release_tag"
            should_publish=true
          else
            previous_version=$(git show "${GITHUB_SHA}^:android/app/build.gradle.kts" | read_version)
            test -n "$previous_version"
            if [ "$version_name" != "$previous_version" ]; then
              should_publish=true
            fi
          fi
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'should_publish=%s\n' "$should_publish" >> "$GITHUB_OUTPUT"

  release:
    name: android-release
    needs: release-plan
    if: needs.release-plan.outputs.should_publish == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    env:
      RELEASE_TAG: ${{ needs.release-plan.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK 36
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0"
      - name: Materialize protected release key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is required" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flexfactor-release.jks"
          test -s "$RUNNER_TEMP/flexfactor-release.jks"
      - name: Build signed production APK
        shell: bash
        env:
          FLEXFACTOR_ANDROID_KEYSTORE: ${{ runner.temp }}/flexfactor-release.jks
          FLEXFACTOR_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          FLEXFACTOR_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLEXFACTOR_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$FLEXFACTOR_ANDROID_STORE_PASSWORD"
          test -n "$FLEXFACTOR_ANDROID_KEY_ALIAS"
          test -n "$FLEXFACTOR_ANDROID_KEY_PASSWORD"
          gradle --no-daemon -p android testDebugUnitTest lintRelease assembleRelease
      - name: Verify signature and record provenance
        shell: bash
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee android/app/build/outputs/apk/release/CERTIFICATE.txt
          (cd android/app/build/outputs/apk/release && sha256sum app-release.apk > SHA256SUMS)
          printf '%s\n' "${GITHUB_SHA}" > android/app/build/outputs/apk/release/SOURCE_COMMIT
      - name: Create signed update manifest
        shell: bash
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          release_dir="android/app/build/outputs/apk/release/publish"
          version_name=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$apk")
          version_code=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "$apk")
          test "$RELEASE_TAG" = "android-v${version_name}"
          mkdir -p "$release_dir"
          release_apk="$release_dir/flexfactor-${version_name}.apk"
          cp "$apk" "$release_apk"
          apk_sha=$(sha256sum "$release_apk" | cut -d' ' -f1)
          apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/flexfactor-${version_name}.apk"
          printf '{\n  "packageName": "com.firer.console.flexfactor",\n  "versionCode": %s,\n  "versionName": "%s",\n  "apkUrl": "%s",\n  "sha256": "%s"\n}\n' \
            "$version_code" "$version_name" "$apk_url" "$apk_sha" \
            > "$release_dir/android-update.json"
      - name: Publish signed APK for in-app updates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="android/app/build/outputs/apk/release/publish"
          version_name=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name \
            "android/app/build/outputs/apk/release/app-release.apk")
          resolve_tag_commit() {
            local object_type object_sha
            object_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')
            object_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
            while [ "$object_type" = "tag" ]; do
              object_type=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object.type')
              object_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object.sha')
            done
            test "$object_type" = "commit"
            printf '%s\n' "$object_sha"
          }
          tag_exists=false
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tag_exists=true
            tag_commit=$(resolve_tag_commit)
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Existing tag $RELEASE_TAG targets $tag_commit, not exact source $GITHUB_SHA" >&2
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$tag_exists" = true
            existing_dir="$RUNNER_TEMP/existing-release-assets"
            mkdir -p "$existing_dir"
            asset_names=$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name')
            ensure_asset() {
              local asset_path="$1"
              local asset_name="$2"
              local asset_label="$3"
              if printf '%s\n' "$asset_names" | grep -Fqx "$asset_name"; then
                gh release download "$RELEASE_TAG" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern "$asset_name" \
                  --dir "$existing_dir"
                if ! cmp -s "$asset_path" "$existing_dir/$asset_name"; then
                  echo "Existing release asset $asset_name does not match this exact build" >&2
                  exit 1
                fi
              else
                gh release upload "$RELEASE_TAG" \
                  "$asset_path#$asset_label" \
                  --repo "$GITHUB_REPOSITORY"
              fi
            }
            ensure_asset \
              "$release_dir/flexfactor-${version_name}.apk" \
              "flexfactor-${version_name}.apk" \
              "FlexFactor Android ${version_name}"
            ensure_asset \
              "$release_dir/android-update.json" \
              "android-update.json" \
              "Signed update manifest"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease=false \
              --latest \
              --title "FlexFactor Android ${version_name}" \
              --notes "Signed FlexFactor Android release from exact source commit ${GITHUB_SHA}."
          else
            create_ref_args=(--target "$GITHUB_SHA")
            if [ "$tag_exists" = true ]; then
              create_ref_args=(--verify-tag)
            fi
            gh release create "$RELEASE_TAG" \
              "$release_dir/flexfactor-${version_name}.apk#FlexFactor Android ${version_name}" \
              "$release_dir/android-update.json#Signed update manifest" \
              --repo "$GITHUB_REPOSITORY" \
              "${create_ref_args[@]}" \
              --title "FlexFactor Android ${version_name}" \
              --notes "Signed FlexFactor Android release from exact source commit ${GITHUB_SHA}."
          fi
      - name: Upload signed exact-commit Android release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flexfactor-android-${{ env.RELEASE_TAG }}-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/CERTIFICATE.txt
            android/app/build/outputs/apk/release/SHA256SUMS
            android/app/build/outputs/apk/release/SOURCE_COMMIT
            android/app/build/outputs/apk/release/publish/android-update.json
          if-no-files-found: error
          retention-days: 90
