[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flexfactor"
version = "0.5.0"
description = "Purpose-driven autonomous code audit, repair, behavioral verification, and evidence tool."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Provider SDKs are imported LAZILY (one key is enough to run), so they are
# optional extras rather than hard install requirements. Version floors are
# pinned to the tested-compatible releases; the Py3.12 SDK compat is fragile
# (see CLAUDE.md), so do not float these upward without re-running the tests.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40,<1.0"]
openai = ["openai>=2,<3"]
# Everything needed to run BOTH providers plus the test/dev workflow.
all = ["anthropic>=0.40,<1.0", "openai>=2,<3"]
dev = ["anthropic>=0.40,<1.0", "openai>=2,<3"]

[project.scripts]
flexfactor = "flexfactor:run_cli"

[tool.setuptools]
py-modules = [
  "flexfactor",
  "flexfactor_autoclean",
  "flexfactor_cmdpolicy",
  "flexfactor_competitors",
  "flexfactor_coverage",
  "flexfactor_dashboard",
  "flexfactor_dashboard_v2",
  "flexfactor_directed",
  "flexfactor_discovery",
  "flexfactor_egress",
  "flexfactor_errors",
  "flexfactor_evidence",
  "flexfactor_flags",
  "flexfactor_journeys",
  "flexfactor_ledger",
  "flexfactor_locate",
  "flexfactor_node_lock",
  "flexfactor_partial",
  "flexfactor_prodready",
  "flexfactor_prodready_engine",
  "flexfactor_prodready_persist",
  "flexfactor_product_invariants",
  "flexfactor_purpose",
  "flexfactor_release_policy",
  "flexfactor_rotation",
  "flexfactor_run",
  "flexfactor_runstate",
  "flexfactor_steering",
  "flexfactor_sandbox",
  "flexfactor_scout_contract",
  "flexfactor_self_audit_report",
  "flexfactor_trust",
  "flexfactor_web",
  "flexfactor_wip",
]

[tool.setuptools.package-data]
flexfactor_assets = ["*.js"]

[tool.setuptools.packages.find]
where = ["."]
include = ["providers*", "competitors*", "tests*", "flexfactor_assets*"]

# Test runner: the suite is stdlib unittest and needs no API keys or network.
#   python flexfactor_tests.py
# or, if pytest is installed:
#   pytest flexfactor_tests.py
[tool.pytest.ini_options]
python_files = ["flexfactor_tests.py"]
