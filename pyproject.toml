[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flexfactor"
version = "0.6.2"
description = "Purpose-driven autonomous code audit, repair, behavioral verification, and evidence tool."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Provider SDKs are imported LAZILY (one key is enough to run), so they are
# optional extras rather than hard install requirements. Version floors are
# pinned to the tested-compatible releases; the Py3.12 SDK compat is fragile
# (see CLAUDE.md), so do not float these upward without re-running the tests.
dependencies = [
  "tree-sitter==0.26.0",
  "tree-sitter-c-sharp==0.23.5",
  "tree-sitter-embedded-template==0.25.0",
  "tree-sitter-yaml==0.7.2",
  "tree-sitter-language-pack==0.7.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40,<1.0"]
openai = ["openai>=2,<3"]
# Everything needed to run BOTH providers plus the test/dev workflow.
all = ["anthropic>=0.40,<1.0", "openai>=2,<3", "socksio>=1,<2"]
dev = ["anthropic>=0.40,<1.0", "openai>=2,<3"]

[project.scripts]
# The installed CLI must enter through flexfactor_run so the directed/runtime
# hardening installer is armed before run_cli executes. Pointing this at the
# monolith bypassed the route filters, capacity guard, skip-dir guard and the
# PowerShell/project-name protections installed by flexfactor_directed.
flexfactor = "flexfactor_run:run_cli"

[tool.setuptools]
py-modules = [
  "flexfactor",
  "flexfactor_autoclean",
  "flexfactor_capacity",
  "flexfactor_cmdpolicy",
  "flexfactor_competitors",
  "flexfactor_coverage",
  "flexfactor_dashboard",
  "flexfactor_dashboard_v2",
  "flexfactor_directed",
  "flexfactor_discovery",
  "flexfactor_egress",
  "flexfactor_errors",
  "flexfactor_execution",
  "flexfactor_evidence",
  "flexfactor_flags",
  "flexfactor_journeys",
  "flexfactor_ledger",
  "flexfactor_locate",
  "flexfactor_node_lock",
  "flexfactor_partial",
  "flexfactor_prodevidence",
  "flexfactor_prodready",
  "flexfactor_prodready_engine",
  "flexfactor_prodready_persist",
  "flexfactor_product_invariants",
  "flexfactor_purpose",
  "flexfactor_release_policy",
  "flexfactor_rotation",
  "flexfactor_run",
  "flexfactor_runstate",
  "flexfactor_steering",
  "flexfactor_sandbox",
  "flexfactor_scout_contract",
  "flexfactor_trust",
  "flexfactor_web",
  "flexfactor_wip",
  "obsidian_memory",
]

[tool.setuptools.package-data]
flexfactor_assets = ["*.js"]
competitors = ["*.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["providers*", "competitors*", "tests*", "flexfactor_assets*"]

# Test runner: the suite needs no API keys or network. Pytest collects the
# monolith, focused contract modules, and conventional test packages; leaving
# the focused modules out previously hid a failed process-containment sweep.
[tool.pytest.ini_options]
python_files = ["flexfactor_tests.py", "flexfactor_*_tests.py", "test_*.py"]
