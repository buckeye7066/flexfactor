[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-public-avatar-studio"
version = "0.4.0"
description = "Independent executable avatar-video studio retained by Program Scout"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
avatar-twin = "avatar_twin.cli:main"
avatar-twin-server = "avatar_twin.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
